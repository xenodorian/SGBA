name: Native runtime

on:
  push:
    paths: ["native/**", "sgba_js_shim.js", "tools/build_native_bundle.py", ".github/workflows/native.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig (pinned, packaged compiler)
        run: python -m pip install ziglang==0.17.0
      - name: Install SDL2 and ffmpeg (the diagnostics and music tests play real sessions)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-2.0-0 ffmpeg
      - name: Build and smoke-test the development build
        run: |
          make -C native
          native/build/x86_64/sgba native/tests/smoke --frames 30 --shot /tmp/smoke.png
          test -s /tmp/smoke.png
      - name: SIMD kernels against their scalar references
        run: |
          gcc -O2 -I native/src native/tests/raster_test.c native/src/raster.c -lm -o /tmp/raster_test
          /tmp/raster_test
      - name: Text cache shutdown twice (AddressSanitizer)
        run: |
          gcc -g -fsanitize=address -I native/src -I native/vendor/stb native/tests/text_test.c native/src/text.c native/build/x86_64/font_data.o -lm -o /tmp/text_test
          /tmp/text_test
      - name: Memory (dropped canvases are freed) and background work (output unchanged)
        run: native/tests/memory_test.sh
      - name: Diagnostics (session lines, crash and unclean-exit reports)
        run: native/tests/reports_test.sh
      - name: Slingshot Orbits sticks (axes 0-3 drive aim and power)
        run: native/tests/stick_test.sh
      - name: Music (32 kHz mono stream is click-free)
        run: native/tests/audio_test.sh
      - name: Quit from the page
        run: native/tests/quit_test.sh
      - name: Build the R36S binary (glibc 2.17)
        run: |
          make -C native TARGET=aarch64
          # nothing newer than glibc 2.17 may be required
          if objdump -T native/build/aarch64/sgba | grep -o 'GLIBC_[0-9.]*' | sort -uV | grep -v -E '^GLIBC_2\.([0-9]|1[0-7])$'; then exit 1; fi
      - name: Build the Windows binary
        run: make -C native TARGET=windows
      - uses: actions/upload-artifact@v4
        with:
          name: sgba-native
          path: |
            native/build/aarch64/sgba
            native/build/windows/sgba.exe
