name: Runtime checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        include:
          # Oldest supported combination (ArkOS 2 is Ubuntu 19.10 based: Python 3.7, SDL 2.0.10)
          - os: ubuntu-22.04
            python-version: "3.7"
            pygame: "2.0.1"
          - os: windows-latest
            python-version: "3.7"
            pygame: "2.0.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Pin minimum supported pygame
        if: matrix.pygame
        run: python -m pip install pygame==${{ matrix.pygame }}
      - name: Compile Python files
        run: python -m compileall -q runtime.py sgba_package.py sgba_shell.py games tests tools
      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Audit game asset budgets
        run: python tools/audit_assets.py
      - name: Benchmark demo update and draw
        env:
          SDL_VIDEODRIVER: dummy
        run: python tools/benchmark_game.py games/demo/main.py --frames 120 --warmup 15 --max-average-ms 16.67

  # Self-contained bundles: nothing needs to be installed on the target device or PC.
  bundle-arkos-aarch64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ARM64 emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user libc6-arm64-cross gcc-aarch64-linux-gnu
      - name: Build ArkOS bundle
        run: python tools/build_bundle.py arkos-aarch64
      - name: Run the test suite with the bundled ARM64 Python and pygame
        env:
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONNOUSERSITE: "1"
        run: |
          APP="$PWD/dist/SGBA-arkos-aarch64/sgba"
          cd "$APP"
          PYTHONPATH="$APP/site:$APP" qemu-aarch64 python/bin/python3.11 -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - uses: actions/upload-artifact@v4
        with:
          name: SGBA-arkos-aarch64
          path: dist/SGBA-arkos-aarch64.zip
      # GitROMs (the R36S downloader) reads the latest release, because Actions
      # artifacts need a login. Pre-releases are ignored by releases/latest, so
      # this must stay a normal release.
      - name: Publish ArkOS bundle to the rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" --notes "Rolling build, replaced on every publish." \
            --target "$GITHUB_SHA" --latest
          gh release upload latest dist/SGBA-arkos-aarch64.zip --clobber

  bundle-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows bundle
        run: python tools/build_bundle.py windows-x64
      - name: Run the test suite with the bundled Python and pygame
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONNOUSERSITE: "1"
        run: |
          $app = Join-Path $PWD "dist/SGBA-windows-x64/sgba"
          $env:PYTHONPATH = "$app\site;$app"
          Set-Location $app
          & "$app\python\python.exe" -m unittest discover -s "$env:GITHUB_WORKSPACE\tests" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SGBA-windows-x64
          path: dist/SGBA-windows-x64.zip
