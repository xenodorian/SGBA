name: Runtime checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        include:
          # Oldest supported combination (ArkOS 2 is Ubuntu 19.10 based: Python 3.7, SDL 2.0.10)
          - os: ubuntu-22.04
            python-version: "3.7"
            pygame: "2.0.1"
          - os: windows-latest
            python-version: "3.7"
            pygame: "2.0.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Pin minimum supported pygame
        if: matrix.pygame
        run: python -m pip install pygame==${{ matrix.pygame }}
      - name: Compile Python files
        run: python -m compileall -q runtime.py sgba_package.py games tests tools
      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Audit game asset budgets
        run: python tools/audit_assets.py
      - name: Benchmark demo update and draw
        env:
          SDL_VIDEODRIVER: dummy
        run: python tools/benchmark_game.py games/demo/main.py --frames 120 --warmup 15 --max-average-ms 16.67
