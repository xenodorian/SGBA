<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slingshot Orbits</title>
</head>
<body>
<canvas id="c" width="640" height="480"></canvas>
<div id="menu">
  <h1 id="menu-title">Slingshot Orbits</h1>
  <p id="menu-intro">Slingshot your ship around the planets and into the portal.</p>
  <p id="menu-note">Orbit 1 has one planet. Each orbit adds one more. Beat orbit 20 to win.</p>
  <button id="btn-go">Pathfinder</button>
  <button id="btn-blind">Blind Crash</button>
  <button id="btn-title">Change mode</button>
  <button id="btn-back">Back to orbit</button>
</div>
<script src="physics.js"></script>
<script src="levels.js"></script>
<script>
(function () {
'use strict';

// Controls (handheld, no sticks needed): D-pad left/right rotates the aim, D-pad up/down sets the power,
// hold B for fine control, A or R1 launches, Start retries, Select opens the menu.
// Blind Crash: X spends 3 stardust to repair 1 HP, Y spends 10 stardust to turn the route line on for the orbit.
// Sticks still work where a pad has them: left stick aims, right stick is a 360 degree power dial
// (up is 0 degrees = no power, left 25%, down 50%, right 75%).
// Speed: everything that does not move is baked once per orbit into one layer (see bakeScene), collisions use a
// lookup grid, and the trajectory preview is computed a slice per frame, because a frame is the unit of cost here.

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const menuEl = document.getElementById('menu');
const menuTitle = document.getElementById('menu-title');
const menuIntro = document.getElementById('menu-intro');
const menuNote = document.getElementById('menu-note');
const btnGo = document.getElementById('btn-go');
const btnBack = document.getElementById('btn-back');
const btnBlind = document.getElementById('btn-blind');
const btnTitle = document.getElementById('btn-title');

const AIM_DEAD = 0.5, DIAL_DEAD = 0.5;      // stick magnitudes below this leave the last aim or dial value in place
const PREVIEW_STEPS = 140;                  // physics steps of the preview computed per frame (a full path is MAX_STEPS)
const PREVIEW_STRIDE = 8;                   // the preview line uses every 8th step
const MAX_PARTICLES = 64;
const GRID = 8, GW = Math.ceil(WORLD_W / GRID), GH = Math.ceil(WORLD_H / GRID);   // collision lookup grid
const LAUNCH_BUTTON = 5, RETRY_BUTTON = 9, MENU_BUTTON = 8, A_BUTTON = 0, B_BUTTON = 1, X_BUTTON = 2, Y_BUTTON = 3;
const MAX_HP = 20, REPAIR_COST = 3, GUIDE_COST = 10;   // Blind Crash: hull points for the whole run, and what stardust buys
const DPAD_UP = 12, DPAD_DOWN = 13, DPAD_LEFT = 14, DPAD_RIGHT = 15;
const AIM_RATE = 1.3, POWER_RATE = 0.45, FINE = 0.2;   // radians per second, power per second, fine-control factor

let total = 0, best = 0, bestPath = 0, bestBlind = 0;
let mode = 'path';                          // 'path' is Pathfinder, 'blind' is Blind Crash
let hp = MAX_HP, wallet = 0;                // Blind Crash: hull points and the stardust the player is carrying
let over = false;                           // Blind Crash: hull points ran out
let finished = false;                       // orbit 20 was cleared: the win screen is up
try { bestPath = Number(localStorage.getItem('slingshot-best')) || 0; bestBlind = Number(localStorage.getItem('slingshot-best-blind')) || 0; } catch (e) {}

let aimAng = 0;                             // launch direction in radians (0 = right, toward the portal)
let power = 0.5;                            // power, 0 to 1 (the dial value)
let S = null;                               // current orbit state
let cache = null;                           // baked sprites for the orbit on screen
let menuOpen = false;
let prevPad = { launch: false, retry: false, menu: false, x: false, y: false };
let pad = { launch: false, retry: false, menu: false, x: false, y: false, up: false, down: false, left: false, right: false, fine: false, sx: 0, sy: 0, tx: 0, ty: 0 };
let msgText = '', msgLeft = 0;
let previewKey = '', frameNo = 0, pv = null;
let launchLock = true;                      // set when a menu closes: the press that chose Launch must not also fire a shot
let hudKey = '', hudCanvas = null, dialKey = '';
let stars = [];
let background = null;
let shake = 0;

// ---------- sound effects ----------
// The browser version synthesised these with oscillators, which SGBA cannot play, so they are rendered files
// (tools/render_slingshot_sfx.py). A missing or unplayable file just stays silent.
function loadSfx(name) {
  try { const a = new Audio('assets/' + name + '.ogg'); a.volume = 1; return a; } catch (e) { return null; }
}
const sfxLaunch = loadSfx('launch'), sfxTarget = loadSfx('target');
function playSfx(a) {
  try { if (!a) return; a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}

// ---------- planets, levels, sprites ----------
// A fixed campaign: orbit N has N planets, from one planet up to MAX_PLANETS, and clearing the last orbit wins the game.
const FINAL_ORBIT = MAX_PLANETS;
function levelKey(orbit) { return orbit + ':' + orbit; }

function makeStars() {
  const rnd = mulberry32(7);
  stars = [];
  for (let i = 0; i < 80; i++) stars.push({ x: rnd() * W, y: rnd() * H, z: 0.1 + rnd() * 0.9, tw: rnd() * TAU });
}

function bakeBackground() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const bg = g.createRadialGradient(W * 0.5, H * 0.45, 50, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  bg.addColorStop(0, '#101a33');
  bg.addColorStop(1, '#03040a');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);
  const nb = g.createRadialGradient(W * 0.7, H * 0.3, 0, W * 0.7, H * 0.3, W * 0.35);
  nb.addColorStop(0, 'rgba(120,60,200,0.12)');
  nb.addColorStop(1, 'rgba(120,60,200,0)');
  g.fillStyle = nb;
  g.fillRect(0, 0, W, H);
  background = c;
}

// The canvas here does not paint gradients along paths, so the planet's shading is built from solid discs:
// the disc shifts toward the light as it shrinks, which reads as a lit sphere at these sizes.
function bakePlanet(p) {
  const half = Math.ceil(p.r * 1.8 + 8), size = half * 2;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');
  const cx = half, cy = half;
  for (let i = 4; i >= 1; i--) {                       // soft glow: faint discs stacked outward
    g.fillStyle = 'hsla(' + p.hue + ',90%,60%,0.08)';
    g.beginPath(); g.arc(cx, cy, p.r * (1 + 0.12 * i), 0, TAU); g.fill();
  }
  const steps = 10;
  for (let i = 0; i < steps; i++) {
    const k = i / (steps - 1);                          // 0 at the rim, 1 at the highlight
    const rr = p.r * (1 - 0.92 * k), off = p.r * 0.35 * k;
    g.fillStyle = 'hsl(' + p.hue + ',' + Math.round(60 - 10 * k) + '%,' + Math.round(12 + 60 * k) + '%)';
    g.beginPath(); g.arc(cx - off, cy - off, rr, 0, TAU); g.fill();
  }
  g.fillStyle = 'hsla(' + (p.hue + 20) + ',50%,80%,0.08)';   // cloud bands, cut to the disc
  for (let i = -2; i <= 2; i++) {
    const dy = i * p.r * 0.28, w = Math.sqrt(Math.max(0, p.r * p.r - dy * dy));
    if (w > 0) g.fillRect(cx - w, cy + dy, 2 * w, p.r * 0.1);
  }
  if (p.ring) {
    g.save();
    g.translate(cx, cy);
    g.rotate(p.tilt);
    g.scale(1, 0.32);
    g.beginPath(); g.arc(0, 0, p.r * 1.7, 0, TAU);
    g.lineWidth = p.r * 0.22;
    g.strokeStyle = 'hsla(' + (p.hue + 40) + ',60%,75%,0.35)';
    g.stroke();
    g.restore();
  }
  return { canvas: c, x: p.x - half, y: p.y - half };
}

// All rocks are drawn as one mass: outlines first, fills on top, so only the outer edge shows.
function bakeRocks(rocks) {
  if (!rocks.length) return null;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (const r of rocks) {
    x0 = Math.min(x0, r.x - r.r - 6); y0 = Math.min(y0, r.y - r.r - 6);
    x1 = Math.max(x1, r.x + r.r + 6); y1 = Math.max(y1, r.y + r.r + 6);
  }
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
  const c = document.createElement('canvas');
  c.width = x1 - x0; c.height = y1 - y0;
  const g = c.getContext('2d');
  g.translate(-x0, -y0);
  g.lineJoin = 'round';
  const path = (r) => {
    g.beginPath();
    for (let i = 0; i < 11; i++) {
      const a = i / 11 * TAU + r.seed;
      const rr = r.r * (0.95 + 0.1 * Math.sin(i * 2.7 + r.seed));
      const x = r.x + Math.cos(a) * rr, y = r.y + Math.sin(a) * rr;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath();
  };
  g.strokeStyle = 'rgba(255,140,90,0.55)';
  g.lineWidth = 4;
  for (const r of rocks) { path(r); g.stroke(); }
  g.fillStyle = '#3a3430';
  for (const r of rocks) { path(r); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,0.035)';
  for (const r of rocks) { g.beginPath(); g.arc(r.x - r.r * 0.25, r.y - r.r * 0.25, r.r * 0.55, 0, TAU); g.fill(); }
  return { canvas: c, x: x0, y: y0 };
}

// Planets as one flat array [x, y, G*m, ...]: the gravity loop is the hot loop and plain indexing is the fastest thing QuickJS does.
function flatPlanets(planets) {
  const a = new Float64Array(planets.length * 3);
  planets.forEach((p, i) => { a[i * 3] = p.x; a[i * 3 + 1] = p.y; a[i * 3 + 2] = G * p.m; });
  return a;
}

// 1 where a ship could touch a planet or rock, 0 where it cannot: most steps then skip the exact tests.
function bakeGrid(planets, rocks) {
  const g = new Uint8Array(GW * GH);
  const mark = (x, y, r) => {
    const x0 = Math.max(0, Math.floor((x - r) / GRID)), x1 = Math.min(GW - 1, Math.floor((x + r) / GRID));
    const y0 = Math.max(0, Math.floor((y - r) / GRID)), y1 = Math.min(GH - 1, Math.floor((y + r) / GRID));
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) g[cy * GW + cx] = 1;
  };
  for (const p of planets) mark(p.x, p.y, p.r + SHIP_R + 2);
  for (const r of rocks) mark(r.x, r.y, r.r + SHIP_R + 2);
  return g;
}

// Everything on screen that does not move, drawn once per orbit into one opaque layer:
// background, stars, faint orbit rings, the red border, planets, rocks, the portal glow and the help line.
function bakeScene(L) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.drawImage(background, 0, 0);
  for (const s of stars) {
    const a = 0.3 + 0.5 * s.z;
    g.fillStyle = 'rgba(200,220,255,' + a.toFixed(2) + ')';
    g.fillRect(s.x, s.y, s.z * 2.2, s.z * 2.2);
  }
  for (const p of L.planets) {
    g.beginPath();
    g.arc(p.x, p.y, p.r + 70, 0, TAU);
    g.strokeStyle = 'hsla(' + p.hue + ',80%,70%,0.07)';
    g.lineWidth = 1.2;
    g.stroke();
  }
  g.strokeStyle = 'rgba(255,90,90,0.55)';
  g.lineWidth = 3;
  g.strokeRect(1.5, 1.5, W - 3, H - 3);
  for (const s of L.planetSprites) g.drawImage(s.canvas, s.x, s.y);
  if (L.rockSprite) g.drawImage(L.rockSprite.canvas, L.rockSprite.x, L.rockSprite.y);
  g.fillStyle = 'rgba(120,255,255,0.12)';
  g.beginPath(); g.arc(L.goal.x * 1, L.goal.y * 1, (GOAL_R - 8) * 0.9, 0, TAU); g.fill();
  return c;
}

// Builds (or reuses) the sprites for orbit n. The level data itself is read-only; dust state is reset each load.
function levelFor(n) {
  const key = levelKey(n);
  const raw = window.SLINGSHOT_LEVELS && window.SLINGSHOT_LEVELS[key];
  if (!raw) return null;
  if (!cache || cache.key !== key) {
    const planets = raw.planets.map(a => ({ x: a[0], y: a[1], r: a[2], m: a[3], hue: a[4], ring: a[5] === 1, tilt: a[6], spin: a[7] }));
    const rocks = raw.rocks.map(a => ({ x: a[0], y: a[1], r: a[2], seed: a[3] }));
    cache = {
      key,
      planets,
      rocks,
      goal: { x: raw.goal[0], y: raw.goal[1] },
      start: { x: raw.start[0], y: raw.start[1] },
      sol: { vx: raw.sol[0], vy: raw.sol[1], tol: raw.sol[2], strict: raw.sol[3] === 1, shortcuts: raw.sol[4] },
      dustRaw: raw.dust,
      planetSprites: planets.map(bakePlanet),
      rockSprite: bakeRocks(rocks),
    };
    cache.gp = flatPlanets(planets);
    cache.grid = bakeGrid(planets, rocks);
    cache.scene = bakeScene(cache);
  }
  return {
    orbit: n, L: cache,
    dust: cache.dustRaw.map(a => ({ x: a[0], y: a[1], ph: a[2], got: false })),
  };
}

// ---------- orbit state ----------
function resetShip() {
  S.ship.x = S.L.start.x; S.ship.y = S.L.start.y;
  S.ship.vx = 0; S.ship.vy = 0;
  S.state = 'idle'; S.trail = []; S.heading = aimAng;
}

function loadOrbit(n) {
  const level = levelFor(n);
  if (!level) { showMsg('No level for orbit ' + n, 2000); return; }
  S = {
    orbit: n, L: level.L, dust: level.dust, dustGot: 0,
    ship: { x: level.L.start.x, y: level.L.start.y, vx: 0, vy: 0 },
    heading: aimAng, state: 'idle', shots: SHOTS, trail: [], guide: false,
    deadT: 0, winT: 0, flyT: 0, acc: 0, particles: [],
  };
  S.preview = null; pv = null;
  previewKey = '';
  showMsg('Orbit ' + n + '  |  ' + level.L.planets.length + ' planet' + (level.L.planets.length === 1 ? '' : 's'), 2200);
}

function launch(vx, vy) {
  playSfx(sfxLaunch);
  if (mode !== 'blind') S.shots--;
  S.ship.vx = vx; S.ship.vy = vy;
  S.heading = Math.atan2(vy, vx);
  S.trail = []; S.acc = 0; S.flyT = 0;
  S.state = 'flying';
}

function physicsStep() {
  const sh = S.ship, L = S.L, gp = L.gp, n = gp.length;
  let ax = 0, ay = 0;
  for (let i = 0; i < n; i += 3) {
    const dx = gp[i] - sh.x, dy = gp[i + 1] - sh.y;
    const d2 = dx * dx + dy * dy + SOFT * SOFT;
    const k = gp[i + 2] / (d2 * Math.sqrt(d2));
    ax += dx * k; ay += dy * k;
  }
  sh.vx += ax * DT; sh.vy += ay * DT;
  sh.x += sh.vx * DT; sh.y += sh.vy * DT;
  S.heading = Math.atan2(sh.vy, sh.vx);

  if ((S.tick = (S.tick || 0) + 1) % 3 === 0) {            // the trail keeps every third step
    S.trail.push(sh.x, sh.y);
    if (S.trail.length > 240) S.trail.splice(0, 2);
  }

  for (const d of S.dust) {
    if (!d.got && (d.x - sh.x) ** 2 + (d.y - sh.y) ** 2 < 22 * 22) {
      d.got = true; S.dustGot++;
      if (mode === 'blind') wallet++;
      burst(d.x, d.y, 10, 48, 140);
    }
  }

  if ((sh.x - L.goal.x) ** 2 + (sh.y - L.goal.y) ** 2 < GOAL_R * GOAL_R) { win(); return; }

  if (sh.x < SHIP_R || sh.x > W - SHIP_R || sh.y < SHIP_R || sh.y > H - SHIP_R) {
    crash(Math.min(W - SHIP_R, Math.max(SHIP_R, sh.x)), Math.min(H - SHIP_R, Math.max(SHIP_R, sh.y)), false, 'Out of bounds');
    return;
  }
  if (L.grid[Math.floor(sh.y / GRID) * GW + Math.floor(sh.x / GRID)]) {
    for (const p of L.planets) {
      if ((sh.x - p.x) ** 2 + (sh.y - p.y) ** 2 < (p.r + SHIP_R) ** 2) { crash(sh.x, sh.y, false); return; }
    }
    for (const r of L.rocks) {
      if ((sh.x - r.x) ** 2 + (sh.y - r.y) ** 2 < (r.r + SHIP_R) ** 2) { crash(sh.x, sh.y, false); return; }
    }
  }
}

function crash(x, y, silent, msg) {
  S.state = 'dead'; S.deadT = 1.1;
  if (mode === 'blind') hp = Math.max(0, hp - 1);
  const tag = mode === 'blind' ? '  HP ' + hp : '';
  if (!silent) {
    burst(x, y, 70, 12, 360);
    shake = 0.8;
    showMsg((msg || 'Impact') + tag, 900);
  } else {
    showMsg('Lost in space' + tag, 900);
  }
}

function win() {
  playSfx(sfxTarget);
  S.state = 'won'; S.winT = 2.6;
  const bonus = 500 + (mode === 'blind' ? 0 : S.shots * 250) + S.dustGot * 100;
  total += bonus;
  if (total > best) {
    best = total;
    if (mode === 'blind') bestBlind = best; else bestPath = best;
    try { localStorage.setItem(mode === 'blind' ? 'slingshot-best-blind' : 'slingshot-best', String(best)); } catch (e) {}
  }
  burst(S.L.goal.x, S.L.goal.y, 120, 190, 260);
  showMsg((S.orbit >= FINAL_ORBIT ? 'Final orbit clear' : 'Orbit clear') + '  +' + bonus, 2400);
}

function update(dt) {
  if (S.state === 'flying') {
    S.flyT += dt;
    if (S.flyT > MAX_FLIGHT) crash(S.ship.x, S.ship.y, true);
    S.acc += dt;
    while (S.state === 'flying' && S.acc >= DT) { S.acc -= DT; physicsStep(); }
  } else if (S.state === 'dead') {
    S.deadT -= dt;
    if (S.deadT <= 0) {
      if (mode === 'blind') { if (hp > 0) resetShip(); else gameOver(); }   // hull points, not shots: launch again from the start
      else if (S.shots > 0) resetShip();
      else { showMsg('Out of shots, retry', 1400); loadOrbit(S.orbit); }
    }
  } else if (S.state === 'won') {
    S.winT -= dt;
    if (S.winT <= 0) { if (S.orbit >= FINAL_ORBIT) finishGame(); else loadOrbit(S.orbit + 1); }
  }
  for (const p of S.particles) {
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.97; p.vy *= 0.97;
  }
  if (S.particles.length) S.particles = S.particles.filter(p => p.life > 0);
}

// ---------- input: read the pad each frame, act on presses and stick positions ----------
function readPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : null;
  const p = pads && pads[0] ? pads[0] : null;
  const pressed = (i) => !!(p && p.buttons[i] && p.buttons[i].pressed);
  const axis = (i) => (p && p.axes && p.axes[i]) || 0;
  pad.launch = pressed(LAUNCH_BUTTON) || pressed(A_BUTTON);
  pad.retry = pressed(RETRY_BUTTON);
  pad.menu = pressed(MENU_BUTTON);
  pad.x = pressed(X_BUTTON); pad.y = pressed(Y_BUTTON);
  pad.up = pressed(DPAD_UP); pad.down = pressed(DPAD_DOWN);
  pad.left = pressed(DPAD_LEFT); pad.right = pressed(DPAD_RIGHT);
  pad.fine = pressed(B_BUTTON);
  pad.sx = axis(0); pad.sy = axis(1);       // left stick
  pad.tx = axis(2); pad.ty = axis(3);       // right stick (dial)
}

function applyAim(dt) {
  const f = pad.fine ? FINE : 1;
  if (pad.left) aimAng -= AIM_RATE * f * dt;         // left turns the aim counter-clockwise, right clockwise
  if (pad.right) aimAng += AIM_RATE * f * dt;
  if (pad.up) power = Math.min(1, power + POWER_RATE * f * dt);
  if (pad.down) power = Math.max(0, power - POWER_RATE * f * dt);
  if (aimAng > Math.PI) aimAng -= TAU; else if (aimAng < -Math.PI) aimAng += TAU;
  const dpad = pad.up || pad.down || pad.left || pad.right;   // SGBA mirrors the d-pad onto the left stick axes: not a stick pull
  if (!dpad && Math.hypot(pad.sx, pad.sy) > AIM_DEAD) aimAng = Math.atan2(-pad.sy, -pad.sx);
  if (Math.hypot(pad.tx, pad.ty) > DIAL_DEAD) {
    const a = Math.atan2(-pad.ty, pad.tx) - Math.PI / 2;   // up is 0, and angles increase counter-clockwise
    power = ((a % TAU) + TAU) % TAU / TAU;
  }
}

function aimVelocity() {
  const m = VMAX * power;
  return { vx: Math.cos(aimAng) * m, vy: Math.sin(aimAng) * m };
}

// The preview is the real flight, computed PREVIEW_STEPS per frame and restarted whenever the aim changes,
// so a long path never costs one long frame. What is computed so far is drawn while the rest catches up.
function updatePreview() {
  const v = aimVelocity();
  const key = Math.round(v.vx * 4) + ',' + Math.round(v.vy * 4);
  if (key !== previewKey || !pv) {
    previewKey = key;
    pv = { x: S.L.start.x, y: S.L.start.y, vx: v.vx, vy: v.vy, s: 0, rec: [S.L.start.x, S.L.start.y], res: 0, done: false };
  }
  if (pv.done) return;
  const L = S.L, gp = L.gp, n = gp.length, grid = L.grid, SS = SOFT * SOFT;
  let x = pv.x, y = pv.y, vx = pv.vx, vy = pv.vy, s = pv.s, res = 0;
  const end = Math.min(MAX_STEPS, s + PREVIEW_STEPS), rec = pv.rec;
  for (; s < end; s++) {
    let ax = 0, ay = 0;
    for (let i = 0; i < n; i += 3) {
      const dx = gp[i] - x, dy = gp[i + 1] - y;
      const d2 = dx * dx + dy * dy + SS;
      const k = gp[i + 2] / (d2 * Math.sqrt(d2));
      ax += dx * k; ay += dy * k;
    }
    vx += ax * DT; vy += ay * DT;
    x += vx * DT; y += vy * DT;
    if (s % PREVIEW_STRIDE === 0) rec.push(x, y);
    if ((x - L.goal.x) ** 2 + (y - L.goal.y) ** 2 < GOAL_R * GOAL_R) { res = 1; break; }
    if (x < SHIP_R || x > W - SHIP_R || y < SHIP_R || y > H - SHIP_R) { res = -1; break; }
    if (grid[Math.floor(y / GRID) * GW + Math.floor(x / GRID)]) {
      for (const p of L.planets) if ((x - p.x) ** 2 + (y - p.y) ** 2 < (p.r + SHIP_R) ** 2) res = -1;
      if (!res) for (const r of L.rocks) if ((x - r.x) ** 2 + (y - r.y) ** 2 < (r.r + SHIP_R) ** 2) { res = -1; break; }
      if (res) break;
    }
  }
  pv.x = x; pv.y = y; pv.vx = vx; pv.vy = vy; pv.s = s;
  if (res) { pv.res = res; pv.done = true; rec.push(x, y); }
  else if (s >= MAX_STEPS) pv.done = true;
  S.preview = pv;
}

function clearPreview() { S.preview = null; pv = null; previewKey = ''; }

// Blind Crash: stardust buys repairs and the route line. Only while the ship sits at the start.
function spendStardust() {
  if (S.state !== 'idle') return;
  if (pad.x && !prevPad.x) {
    if (hp >= MAX_HP) showMsg('Hull already intact', 1200);
    else if (wallet < REPAIR_COST) showMsg('Repair needs ' + REPAIR_COST + ' stardust', 1400);
    else { wallet -= REPAIR_COST; hp++; showMsg('Hull repaired  HP ' + hp, 1400); }
  }
  if (pad.y && !prevPad.y) {
    if (S.guide) showMsg('Route line already on', 1200);
    else if (wallet < GUIDE_COST) showMsg('Route line needs ' + GUIDE_COST + ' stardust', 1400);
    else { wallet -= GUIDE_COST; S.guide = true; clearPreview(); showMsg('Route line on for this orbit', 1600); }
  }
}

function handleInput(dt) {
  if (menuOpen) return;
  if (pad.menu && !prevPad.menu) { openMenu(); return; }
  if (!S) return;
  if (pad.retry && !prevPad.retry && S.state !== 'won' && mode !== 'blind') { loadOrbit(S.orbit); return; }   // a retry would respawn the stardust
  if (mode === 'blind') spendStardust();
  applyAim(dt);
  if (!pad.launch) launchLock = false;
  if (S.state === 'idle') {
    if (power > 0.01 && (mode === 'blind' || S.shots > 0)) {
      if (mode !== 'blind' || S.guide) updatePreview(); else clearPreview();   // Blind Crash has no route line unless it was bought
      if (pad.launch && !prevPad.launch && !launchLock) {
        const v = aimVelocity();
        launch(v.vx, v.vy);
      }
    } else clearPreview();
  }
}

// ---------- menu ----------
// One panel serves four purposes: the title screen (pick a mode), the Select menu during play, the win screen and
// the Blind Crash game over screen.
const MODE_NAME = { path: 'Pathfinder', blind: 'Blind Crash' };
function showPanel(kind) {
  const end = kind === 'win' || kind === 'over';
  btnGo.textContent = end ? (kind === 'win' ? 'Play again' : 'Try again') : MODE_NAME.path;
  btnBlind.style.display = end ? 'none' : '';
  btnTitle.style.display = end ? '' : 'none';
  btnBack.style.display = !end && S && !over ? '' : 'none';
  if (kind === 'win') {
    menuTitle.textContent = 'You beat ' + MODE_NAME[mode];
    menuIntro.textContent = 'All ' + FINAL_ORBIT + ' orbits cleared. Final score ' + total + '.';
    menuNote.textContent = best > 0 ? 'Best score ' + best + '.' : '';
  } else if (kind === 'over') {
    menuTitle.textContent = 'Game over';
    menuIntro.textContent = 'The hull gave out on orbit ' + S.orbit + ' of ' + FINAL_ORBIT + '. Score ' + total + '.';
    menuNote.textContent = best > 0 ? 'Best score ' + best + '.' : '';
  } else {
    menuTitle.textContent = 'Slingshot Orbits';
    menuIntro.textContent = S ? 'Choosing a mode starts a new game at orbit 1.' : 'Pick a mode.';
    menuNote.textContent = 'Pathfinder: the route line shows your shot. Blind Crash: no line, 20 HP for all ' + FINAL_ORBIT + ' orbits.';
  }
}

function openMenu(kind) {
  menuOpen = true;
  menuEl.style.display = 'block';
  showPanel(kind);
}

function closeMenu() {
  menuOpen = false; launchLock = true;
  menuEl.style.display = 'none';
}

function finishGame() {
  finished = true;
  openMenu('win');
}

function gameOver() {
  over = true;
  openMenu('over');
}

// ---------- music ----------
// The browser version synthesised this with oscillators, which SGBA cannot play. assets/slingshot_music.ogg is the same
// recipe rendered offline (tools/render_slingshot_music.py), a 67 s seamless loop.
let music = null;
function startMusic() {
  try {
    if (!music) { music = new Audio('assets/slingshot_music.ogg'); music.loop = true; music.volume = 0.7; }
    if (music.paused) { const p = music.play(); if (p && p.catch) p.catch(() => {}); }   // a browser may refuse before a gesture; startGame tries again
  } catch (e) {}
}

function startGame(m) {
  startMusic();
  mode = m === 'blind' ? 'blind' : 'path';
  best = mode === 'blind' ? bestBlind : bestPath;
  finished = false; over = false;
  hp = MAX_HP; wallet = 0;
  total = 0;
  closeMenu();
  shake = 0;
  loadOrbit(1);
}

btnGo.addEventListener('click', () => startGame(finished || over ? mode : 'path'));   // Play again keeps the mode
btnBlind.addEventListener('click', () => startGame('blind'));
btnTitle.addEventListener('click', () => { finished = false; over = false; showPanel('title'); });
btnBack.addEventListener('click', closeMenu);
showPanel('title');

// ---------- effects ----------
function burst(x, y, n, hue, speed) {
  for (let i = 0; i < n && S.particles.length < MAX_PARTICLES; i++) {
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    S.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.9, max: 1.4, hue: hue + Math.random() * 30 - 15 });
  }
}

function showMsg(text, ms) {
  msgText = text;
  msgLeft = ms / 1000;
}

// ---------- drawing ----------
// Per frame only what moves is drawn, and each thing is one or two canvas calls (the scene itself is one drawImage).
const PCOLORS = [];                          // particle colours: 4 hues x 4 alpha steps, built once
const PHUES = [12, 48, 120, 190];
for (let h = 0; h < 4; h++) { PCOLORS.push([]); for (let a = 0; a < 4; a++) PCOLORS[h].push('hsla(' + PHUES[h] + ',100%,65%,' + ((a + 1) / 4).toFixed(2) + ')'); }
const TRAIL_STYLE = ['rgba(120,200,255,0.18)', 'rgba(120,200,255,0.4)', 'rgba(120,200,255,0.65)'];
const PORTAL_STYLE = ['hsla(185,100%,72%,0.95)', 'hsla(210,100%,72%,0.75)', 'hsla(235,100%,72%,0.55)'];

function drawPreview(rec, rgb, endRes) {
  if (rec.length < 4) return;
  ctx.strokeStyle = 'rgba(' + rgb + ',0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rec[0], rec[1]);
  for (let i = 2; i < rec.length; i += 2) ctx.lineTo(rec[i], rec[i + 1]);
  ctx.stroke();
  if (endRes === -1) {
    const x = rec[rec.length - 2], y = rec[rec.length - 1];
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y + 6);
    ctx.moveTo(x + 6, y - 6); ctx.lineTo(x - 6, y + 6);
    ctx.stroke();
  }
}

function drawPortal(t) {
  const g = S.L.goal;
  ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const rot = t * (0.6 + i * 0.35) * (i % 2 ? -1 : 1);
    ctx.strokeStyle = PORTAL_STYLE[i];
    ctx.beginPath();
    ctx.arc(g.x, g.y, (GOAL_R - i * 5) * 0.9, rot + 0.15, rot + Math.PI * 1.7);
    ctx.stroke();
  }
}

function drawDust(d, t) {
  const s = 0.7 + 0.3 * Math.sin(t * 3 + d.ph), a = t * 0.8 + d.ph;
  const c = Math.cos(a), n = Math.sin(a);
  const pt = (px, py) => ctx.lineTo(d.x + px * c - py * n, d.y + px * n + py * c);
  ctx.beginPath();
  ctx.moveTo(d.x + 0 * c + 6 * s * n, d.y - 6 * s * c);
  pt(4 * s, 0); pt(0, 6 * s); pt(-4 * s, 0);
  ctx.closePath(); ctx.fill();
}

function drawShip() {
  const sh = S.ship, c = Math.cos(S.heading), n = Math.sin(S.heading);
  const pt = (px, py) => [sh.x + px * c - py * n, sh.y + px * n + py * c];
  if (S.state === 'flying') {
    const a = pt(-4, -2.5), b = pt(-14 - (frameNo % 5) * 1.2, 0), d = pt(-4, 2.5);
    ctx.fillStyle = 'rgba(255,170,90,0.8)';
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(d[0], d[1]); ctx.fill();
  }
  const p0 = pt(12, 0), p1 = pt(-8, 6.5), p2 = pt(-3.5, 0), p3 = pt(-8, -6.5);
  ctx.fillStyle = '#eaf6ff';
  ctx.beginPath();
  ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]);
  ctx.closePath(); ctx.fill();
}

function drawAim() {
  const len = 26 + 60 * power;
  const cx = S.ship.x, cy = S.ship.y;
  if (S.preview) {
    const res = S.preview.res;
    drawPreview(S.preview.rec, res === 1 ? '120,255,170' : res === -1 ? '255,110,110' : '255,200,110', res);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(aimAng) * len, cy + Math.sin(aimAng) * len);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,200,110,0.9)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, 22, -Math.PI / 2, -Math.PI / 2 + TAU * power);
  ctx.stroke();
}

function drawDial() {
  const cx = 52, cy = 428, r = 26;
  ctx.strokeStyle = 'rgba(120,170,255,0.35)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,200,110,0.95)';
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + TAU * power); ctx.stroke();
  const a = -Math.PI / 2 + TAU * power;
  ctx.fillStyle = '#eaf6ff';
  ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 4, 0, TAU); ctx.fill();
  const label = 'POWER ' + Math.round(power * 100) + '%';
  if (label !== dialKey || !dialCanvas) {                 // the label is text, so it is redrawn only when it changes
    dialKey = label;
    dialCanvas = dialCanvas || document.createElement('canvas');
    dialCanvas.width = 110; dialCanvas.height = 20;
    const g = dialCanvas.getContext('2d');
    g.clearRect(0, 0, 110, 20);
    g.fillStyle = '#d9e6ff';
    g.font = '14px sans-serif';
    g.fillText(label, 0, 14);
  }
  ctx.drawImage(dialCanvas, cx + 38, cy - 9);
}
let dialCanvas = null;

// The control hint along the bottom edge, baked once per mode.
const helpCanvas = {};
function drawHelp() {
  if (!helpCanvas[mode]) {
    const c = document.createElement('canvas');
    c.width = W; c.height = 16;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(217,230,255,0.55)';
    g.font = '12px sans-serif';
    g.textAlign = 'center';
    g.fillText(mode === 'blind'
      ? 'Up/Down power | Left/Right aim | B fine | A launch | X repair ' + REPAIR_COST + ' | Y route line ' + GUIDE_COST + ' | Select menu'
      : 'Up/Down power | Left/Right aim | B fine | A launch | Start retry | Select menu', W / 2, 12);
    helpCanvas[mode] = c;
  }
  ctx.drawImage(helpCanvas[mode], 0, H - 20);
}

// The HUD line is text, so it is baked into its own strip and redrawn only when a number changes.
function drawHud() {
  const items = mode === 'blind'
    ? ['ORBIT ' + S.orbit + '/' + FINAL_ORBIT, 'HP ' + hp + '/' + MAX_HP, 'STARDUST ' + wallet, 'PLANETS ' + S.L.planets.length, 'SCORE ' + total, 'BEST ' + best]
    : ['ORBIT ' + S.orbit + '/' + FINAL_ORBIT, 'SHOTS ' + S.shots, 'PLANETS ' + S.L.planets.length,
      'STARDUST ' + S.dustGot + '/' + S.dust.length, 'SCORE ' + total, 'BEST ' + best];
  const key = items.join('|');
  if (key !== hudKey || !hudCanvas) {
    hudKey = key;
    hudCanvas = hudCanvas || document.createElement('canvas');
    hudCanvas.width = W; hudCanvas.height = 34;
    const g = hudCanvas.getContext('2d');
    g.clearRect(0, 0, W, 34);
    g.fillStyle = '#d9e6ff';
    g.font = '14px sans-serif';
    let x = 18;
    for (const text of items) { g.fillText(text, x, 24); x += g.measureText(text).width + 22; }
  }
  ctx.drawImage(hudCanvas, 0, 0);
}

function drawMessage() {
  if (msgLeft <= 0 || !msgText) return;
  ctx.globalAlpha = Math.min(1, msgLeft / 0.35);
  ctx.fillStyle = '#ffd08a';
  ctx.font = '26px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(msgText, W / 2, H * 0.38);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function draw(t) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  if (!S) { ctx.drawImage(background, 0, 0); ctx.restore(); return; }
  const L = S.L;
  ctx.drawImage(L.scene, 0, 0);

  for (let i = 0; i < 8; i++) {                        // the only stars that move: eight twinklers
    const s = stars[i];
    const x = ((s.x - t * 12 * s.z) % W + W) % W;
    ctx.fillStyle = 'rgba(200,220,255,' + ((0.4 + 0.6 * Math.abs(Math.sin(t * 1.3 + s.tw))) * s.z).toFixed(1) + ')';
    ctx.fillRect(x, s.y, s.z * 2.2, s.z * 2.2);
  }
  drawPortal(t);
  ctx.fillStyle = '#ffe9a0';
  for (const d of S.dust) if (!d.got) drawDust(d, t);

  if (S.state === 'idle') drawAim();

  const tr = S.trail, nt = tr.length;
  if (nt > 4) {                                        // three strokes, older to newer, instead of one per segment
    ctx.lineWidth = 2;
    for (let b = 0; b < 3; b++) {
      const i0 = Math.floor(nt / 6) * 2 * b, i1 = b === 2 ? nt : Math.floor(nt / 6) * 2 * (b + 1) + 2;
      if (i1 - i0 < 4) continue;
      ctx.strokeStyle = TRAIL_STYLE[b];
      ctx.beginPath();
      ctx.moveTo(tr[i0], tr[i0 + 1]);
      for (let i = i0 + 2; i < i1 && i < nt; i += 2) ctx.lineTo(tr[i], tr[i + 1]);
      ctx.stroke();
    }
  }

  if (S.state !== 'dead') drawShip();

  for (const p of S.particles) {
    const a = Math.max(0, Math.min(1, p.life / p.max));
    ctx.fillStyle = PCOLORS[p.hue < 30 ? 0 : p.hue < 90 ? 1 : p.hue < 150 ? 2 : 3][Math.min(3, Math.floor(a * 4))];
    const sz = 2 + a * 2;
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  ctx.restore();

  drawHud();
  drawHelp();
  if (S.state === 'idle' || S.state === 'flying') drawDial();
  drawMessage();
}

// ---------- main loop: fixed-step physics, one draw per frame ----------
let last = null;
function frame(now) {
  frameNo++;
  const dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000);
  last = now;
  readPad();
  if (msgLeft > 0) msgLeft -= dt;
  shake = Math.max(0, shake - dt * 2.2);
  if (!menuOpen && S) update(dt);
  handleInput(dt);
  prevPad = { launch: pad.launch, retry: pad.retry, menu: pad.menu, x: pad.x, y: pad.y };
  draw(now / 1000);
  requestAnimationFrame(frame);
}

// Read-only status for tests and debugging: window.slingshotStatus() returns null before the first launch.
window.slingshotStatus = () => S ? {
  orbit: S.orbit, state: S.state, shots: S.shots, planets: S.L.planets.length, dust: S.dustGot,
  total, best, aim: aimAng, power, x: S.ship.x, y: S.ship.y, menu: menuOpen, finished,
  mode, hp, stardust: wallet, guide: S.guide, over, preview: !!S.preview,
} : null;
// Test hook: jump straight to an orbit (the tests use it to reach the final orbit without playing the nineteen before it).
// Test hook: set the Blind Crash hull points and carried stardust.
window.slingshotGrant = (h, d) => { hp = h; wallet = d; hudKey = ''; };
window.slingshotGoto = (n) => { finished = false; over = false; closeMenu(); loadOrbit(n); };

makeStars();
bakeBackground();
startMusic();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
